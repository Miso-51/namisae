<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7FD6F5">
<title>내 친구 남미새 만들기</title>
<style>
@font-face{font-family:"Mulmaru";src:url("Mulmaru.woff2") format("woff2");font-display:swap}
@font-face{font-family:"ThinMulmaru";src:url("ThinMulmaru.ttf") format("truetype");font-display:swap}
:root{
  --sky:#7FD6F5; --sky2:#B7ECFF; --ink:#2B2340; --panel:#FFFFFF; --panel2:#EEF8FF; --text:#2B2340; --muted:#6A6488;
  --pink:#FF4FA0; --pink2:#D93682; --lime:#C6F14A; --lime2:#9CCB25; --blue:#3B82F6; --blue2:#2563C9;
  --yellow:#FFD93D; --red:#FF5A3C; --red2:#D63E22; --grass:#4FC562; --grass2:#2F9A47; --dirt:#8B5A3C;
  --up:#16934A; --dn:#E0284E;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky:#1E2A5E; --sky2:#2C3B7A; --panel:#26244A; --panel2:#33305E; --text:#F3F0FF; --muted:#B9B3E0;
    --grass:#2E8C45; --grass2:#1F6632; --up:#5FE08F; --dn:#FF7A93; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#1E2A5E; --sky2:#2C3B7A; --panel:#26244A; --panel2:#33305E; --text:#F3F0FF; --muted:#B9B3E0;
  --grass:#2E8C45; --grass2:#1F6632; --up:#5FE08F; --dn:#FF7A93; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;min-height:100%;background:var(--sky);color:var(--text);
  font-family:"ThinMulmaru","Mulmaru","Apple SD Gothic Neo",sans-serif;font-size:16px;line-height:1.5;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;-webkit-text-size-adjust:100%}
.d{font-family:"Mulmaru","ThinMulmaru",sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,label:focus-within,input:focus-visible{outline:3px dashed var(--pink);outline-offset:3px}
img{image-rendering:auto}
svg.pxs{shape-rendering:crispEdges}

/* sky decoration */
.skydeco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.skydeco svg{position:absolute;width:100%;height:100%}
.app{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:10px 12px 110px}
.screen{display:none}.screen.on{display:block}

/* pixel box */
.px{background:var(--panel);margin:4px;position:relative;
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset 0 -4px 0 0 rgba(0,0,0,.08)}
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:"Mulmaru",sans-serif;min-height:48px;padding:8px 16px;margin:4px;
  background:var(--c,var(--panel));color:var(--tc,var(--text));
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset 0 -5px 0 0 var(--c2,rgba(0,0,0,.15)),inset 0 4px 0 0 rgba(255,255,255,.35)}
.pbtn:active{transform:translateY(2px);box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset 0 4px 0 0 var(--c2,rgba(0,0,0,.15))}
.pbtn[disabled]{opacity:.45;cursor:not-allowed}
.pk{--c:var(--pink);--c2:var(--pink2);--tc:#fff}
.lm{--c:var(--lime);--c2:var(--lime2);--tc:#2B2340}
.bl{--c:var(--blue);--c2:var(--blue2);--tc:#fff}
.rd{--c:var(--red);--c2:var(--red2);--tc:#fff}
.yl{--c:var(--yellow);--c2:#D9B416;--tc:#2B2340}
.wide{display:flex;width:calc(100% - 8px)}
.big{font-size:22px;min-height:60px}
.sm{min-height:40px;padding:4px 10px;font-size:14px}
.row{display:flex;gap:6px}.row>*{flex:1}
.muted{color:var(--muted);font-size:14px}
.ctr{text-align:center}

/* HUD */
.hud{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.hud .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:"Mulmaru",sans-serif;font-size:14px;background:var(--panel);padding:4px 10px;min-height:32px;margin:4px;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:6px}
.hearts{display:flex;gap:2px}
.hearts svg{width:22px;height:20px}

/* scene */
.scene{position:relative;width:100%;aspect-ratio:1;overflow:hidden;container-type:inline-size;background:#9ED9FF}
.scene>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.ch,.np{position:absolute;transform:translateX(-50%)}
.ch{aspect-ratio:24/27}.np{aspect-ratio:24/36}
.ch>svg,.np>svg{position:absolute;inset:0;width:100%;height:100%}
.np.fl>svg{transform:scaleX(-1)}
.fc{position:absolute;left:12%;width:76%;bottom:91%;transform:rotate(-6deg);transform-origin:50% 100%}
.fc img{display:block;width:100%;height:auto;filter:drop-shadow(.4cqw .6cqw 0 rgba(0,0,0,.35))}
.fc svg{position:absolute;inset:0;width:100%;height:100%}
.cap{position:absolute;left:3%;right:3%;top:3%;text-align:center;font-family:"Mulmaru",sans-serif;font-size:7.4cqw;line-height:1.15;color:#fff;z-index:6;word-break:keep-all;
  text-shadow:.6cqw 0 0 #000,-.6cqw 0 0 #000,0 .6cqw 0 #000,0 -.6cqw 0 #000,.6cqw .6cqw 0 #000,-.6cqw .6cqw 0 #000,.6cqw -.6cqw 0 #000,-.6cqw -.6cqw 0 #000}
.cap.y{color:#FFE14D}
.stk{position:absolute;transform:translate(-50%,-50%);line-height:1;z-index:5;filter:drop-shadow(.3cqw .5cqw 0 rgba(0,0,0,.3))}
.bub{position:absolute;transform:translate(-50%,-50%);z-index:5;background:#fff;color:#2B2340;font-family:"Mulmaru",sans-serif;font-size:4.6cqw;padding:1.2cqw 2.6cqw;white-space:nowrap;
  box-shadow:0 -.8cqw 0 0 #2B2340,0 .8cqw 0 0 #2B2340,-.8cqw 0 0 0 #2B2340,.8cqw 0 0 0 #2B2340}
.bub.k{background:#FEE500}
.tag{position:absolute;left:3%;bottom:3%;z-index:6;background:var(--yellow);color:#2B2340;font-family:"Mulmaru",sans-serif;font-size:4.6cqw;padding:.4cqw 2cqw;
  box-shadow:0 -.6cqw 0 0 #2B2340,0 .6cqw 0 0 #2B2340,-.6cqw 0 0 0 #2B2340,.6cqw 0 0 0 #2B2340}

/* home */
.homescene{cursor:pointer}
.slot{display:flex;align-items:center;gap:10px;width:calc(100% - 8px);text-align:left;padding:10px 12px;min-height:60px}
.slot .ic{font-size:26px;width:34px;text-align:center}
.slot .tx{flex:1;min-width:0}
.slot .lb{font-family:"Mulmaru",sans-serif;font-size:13px;color:var(--muted)}
.slot .vl{font-family:"Mulmaru",sans-serif;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .ar{font-family:"Mulmaru",sans-serif;color:var(--muted)}
.slot.need .vl{color:var(--pink)}
.money{display:flex;justify-content:space-between;font-family:"Mulmaru",sans-serif;font-size:14px;padding:8px 12px}
.money .bad{color:var(--dn)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--grass);
  box-shadow:0 -4px 0 0 var(--ink),inset 0 4px 0 0 var(--grass2)}
.nav .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{font-family:"Mulmaru",sans-serif;font-size:13px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px}
.nav button span{font-size:22px;line-height:1.1}

/* popup */
.pop{position:fixed;inset:0;z-index:50;background:rgba(20,16,40,.55);display:none;align-items:flex-end;justify-content:center;padding:0 8px}
.pop.on{display:flex}
.pbox{width:100%;max-width:452px;max-height:86vh;display:flex;flex-direction:column;margin:4px 4px calc(10px + env(safe-area-inset-bottom,0px))}
.phd{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--pink);color:#fff;font-family:"Mulmaru",sans-serif;font-size:18px;box-shadow:inset 0 -4px 0 0 var(--pink2)}
.phd span{flex:1}
.phd button{width:36px;height:36px;font-size:18px;background:#fff;color:var(--ink);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.pbd{overflow:auto;padding:12px;flex:1}
.opt{display:flex;align-items:center;gap:10px;width:calc(100% - 8px);text-align:left;padding:10px 12px;min-height:58px;background:var(--panel)}
.opt .ic{font-size:26px;width:34px;text-align:center;flex:none}
.opt .tx{flex:1;min-width:0}
.opt .nm{font-family:"Mulmaru",sans-serif;font-size:16px;display:block}
.opt .ef{font-size:13px;color:var(--muted);display:block;line-height:1.35}
.opt .pr{font-family:"Mulmaru",sans-serif;font-size:14px;white-space:nowrap}
.opt.sel{background:#FFE3F1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .opt.sel{background:#5A2A55}}
.opt.lock{opacity:.5}
.opts{display:grid;gap:6px}
.tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{flex:1;min-width:70px}
.tabs button[aria-selected="true"]{--c:var(--yellow);--c2:#D9B416;--tc:#2B2340}
.nights{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.up{color:var(--up)}.dn{color:var(--dn)}
.fx{font-family:"Mulmaru",sans-serif;font-size:12px}
.bar{height:16px;background:var(--panel2);margin:6px 4px 4px;box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--c) 0 8px,transparent 8px 10px)}
.statrow{margin-bottom:8px}
.statrow .lab{display:flex;justify-content:space-between;font-family:"Mulmaru",sans-serif;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:2px dashed var(--panel2);font-size:15px}
.kv:last-child{border-bottom:0}
.kv b{font-family:"Mulmaru",sans-serif;font-weight:400}
.sec{font-family:"Mulmaru",sans-serif;font-size:17px;margin:14px 4px 6px}
.note{font-size:14px;color:var(--muted);margin:4px}

/* card */
.card{--cc:#9ED9FF;background:var(--cc);padding:10px 10px 8px;margin:6px;color:#2B2340;
  box-shadow:0 -5px 0 0 var(--ink),0 5px 0 0 var(--ink),-5px 0 0 0 var(--ink),5px 0 0 0 var(--ink),inset 0 -6px 0 0 rgba(0,0,0,.12)}
.card .chd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:"Mulmaru",sans-serif;font-size:19px;margin-bottom:8px}
.card .chd .st{font-size:15px;letter-spacing:1px;white-space:nowrap}
.card .cim{background:#FFF8EC;padding:0;box-shadow:0 0 0 4px var(--ink)}
.card .cds{background:#FFF8EC;margin-top:10px;padding:8px 10px;font-size:15px;line-height:1.45;box-shadow:0 0 0 3px var(--ink)}
.card .cfx{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.card .cfx span{font-family:"Mulmaru",sans-serif;font-size:13px;background:#FFF8EC;padding:2px 6px;box-shadow:0 0 0 3px var(--ink)}
.card .cfx .up{color:#11823F}.card .cfx .dn{color:#D21F45}
.card .cft{display:flex;justify-content:space-between;font-family:"Mulmaru",sans-serif;font-size:12px;margin-top:10px}
.pop-in{animation:popin .32s steps(4,end)}
@keyframes popin{from{transform:scale(.7) rotate(-4deg);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pop-in{animation:none}}
.in{position:absolute;inset:0}
.in>svg{position:absolute;inset:0;width:100%;height:100%}
.np.fl .in>svg{transform:scaleX(-1)}
.tbl{position:absolute;left:-2%;right:-2%;bottom:0;height:17%;background:var(--tb);z-index:4;box-shadow:inset 0 1.4cqw 0 0 rgba(255,255,255,.35),inset 0 -1.2cqw 0 0 rgba(0,0,0,.2),0 -.8cqw 0 0 #2B2340}
.speed{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.speed i{position:absolute;left:105%;width:16cqw;height:1cqw;background:rgba(255,255,255,.85);animation:streak .8s linear infinite}
@keyframes streak{from{left:105%}to{left:-25%}}
.prop{position:absolute;width:24%;aspect-ratio:9/18;z-index:2}
.prop svg{display:block;width:100%;height:100%}
.prop.racket{left:68%;bottom:36%;transform-origin:50% 100%;animation:swing 1.2s steps(6,jump-none) infinite}
.np .prop.racket{bottom:28%}
.prop.club{left:58%;top:46%;transform-origin:50% 0;animation:club 1.6s steps(6,jump-none) infinite}
.np .prop.club{top:58%}
.np.fl .prop{left:auto;right:68%}
.hbub{position:absolute;left:50%;bottom:182%;transform:translateX(-50%);background:#fff;color:#2B2340;font-family:"Mulmaru",sans-serif;font-size:4.4cqw;line-height:1.2;padding:1.2cqw 2.6cqw;white-space:nowrap;z-index:7;
  box-shadow:0 -.8cqw 0 0 #2B2340,0 .8cqw 0 0 #2B2340,-.8cqw 0 0 0 #2B2340,.8cqw 0 0 0 #2B2340}
.hbub::after{content:"";position:absolute;left:50%;bottom:-2.4cqw;width:2cqw;height:1.6cqw;background:#2B2340;transform:translateX(-50%)}
.hbub:empty{display:none}
@keyframes bob{50%{transform:translateY(-4%)}}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes hop{50%{transform:translateY(-12%)}}
@keyframes climb{to{transform:translateY(-16%)}}
@keyframes lean{0%,100%{transform:rotate(-3deg)}40%{transform:rotate(6deg)}}
@keyframes swing{0%,100%{transform:rotate(-70deg)}40%{transform:rotate(65deg)}}
@keyframes club{0%,100%{transform:rotate(120deg)}45%{transform:rotate(-60deg)}}
@keyframes drift{from{transform:translateX(-50%) translateX(-5cqw)}to{transform:translateX(-50%) translateX(5cqw)}}
@keyframes across{from{transform:translateX(-50%) translateX(-80cqw)}to{transform:translateX(-50%) translateX(80cqw)}}
@keyframes roam{0%,10%{left:30%}42%,58%{left:66%}90%,100%{left:30%}}
@keyframes ball{0%{transform:translate(-50%,-50%) translate(-22cqw,0)}50%{transform:translate(-50%,-50%) translate(0,-14cqw)}100%{transform:translate(-50%,-50%) translate(22cqw,0)}}
@keyframes float{to{transform:translate(-50%,-50%) translateY(-2.5cqw)}}
@keyframes pulse{to{transform:translate(-50%,-50%) scale(1.25)}}
@keyframes fly{0%{transform:translate(-50%,-50%) translate(-28cqw,12cqw) rotate(-25deg)}100%{transform:translate(-50%,-50%) translate(24cqw,-8cqw) rotate(25deg)}}
.an-bob{animation:bob 1s steps(2,jump-none) infinite}
.an-walk{animation:bob .5s steps(2,jump-none) infinite}
.an-run{animation:bob .3s steps(2,jump-none) infinite}
.an-write{animation:bob 1.4s steps(2,jump-none) infinite}
.an-sway{animation:sway 1s steps(2,jump-none) infinite alternate;transform-origin:50% 100%}
.an-hop{animation:hop .8s steps(3,jump-none) infinite}
.an-climb{animation:climb 2.4s steps(4,jump-none) infinite alternate}
.an-lean{animation:lean 1.2s steps(3,jump-none) infinite;transform-origin:50% 100%}
.tr-drift{animation:drift 2.8s ease-in-out infinite alternate}
.tr-across{animation:across 3.4s linear infinite}
.tr-roam{animation:roam 20s linear infinite}
.s-ball{animation:ball 1.2s ease-in-out infinite alternate}
.s-float{animation:float 1.4s steps(2,jump-none) infinite alternate}
.s-pulse{animation:pulse .9s steps(2,jump-none) infinite alternate}
.s-fly{animation:fly 2.6s linear infinite}
.wtag{display:inline-block;font-family:"Mulmaru",sans-serif;font-size:11px;line-height:1.4;padding:0 5px;margin-left:6px;background:#FFE3F1;color:#D93682;box-shadow:0 0 0 2px var(--ink);vertical-align:middle}
.wtag.no{background:#E5E2F0;color:#4A4560}
.prof{display:grid;grid-template-columns:44% 1fr;gap:12px;align-items:center}
.ptr{background:var(--bgc);aspect-ratio:1;margin:12px;box-shadow:0 0 0 4px #8B5A3C,0 0 0 7px #C98A4B,0 0 0 10px #2B2340}
.ptr svg{display:block;width:100%;height:100%}
.pinfo{font-size:15px;line-height:1.5}
.men{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.men .mc{text-align:center;font-size:12px;font-family:"Mulmaru",sans-serif}
.men .ptr{margin:10px}
#cardBtns{flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.in,.ch,.np,.stk,.prop,.speed i{animation:none!important}}

.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dex button{aspect-ratio:3/4;font-family:"Mulmaru",sans-serif;font-size:11px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:4px;margin:3px;background:var(--cc,#ddd);color:#2B2340;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.dex button .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.dex button .im{flex:1;margin-top:3px;box-shadow:0 0 0 2px var(--ink);overflow:hidden;position:relative}
.dex button.no{--cc:#B8B4CC;color:#555}
.dex button.no .im{display:grid;place-items:center;font-size:26px;background:#9C98B4}

/* title */
.logo{text-align:center;color:#fff;font-family:"Mulmaru",sans-serif;line-height:1.05;margin:6px 0 0;font-weight:400;
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 7px 0 var(--ink)}
.logo .a{display:block;font-size:30px}
.logo .b{display:block;font-size:60px;color:#FFE14D}
.logo .c{display:block;font-size:40px}
.ribbon{display:inline-block;background:var(--pink);color:#fff;font-family:"Mulmaru",sans-serif;font-size:15px;padding:6px 18px;transform:skewX(-10deg);
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.ribbon span{display:inline-block;transform:skewX(10deg)}
.stars{font-size:26px;color:#FFD93D;text-shadow:2px 2px 0 var(--ink);letter-spacing:4px}

/* crop */
.stage{position:relative;width:100%;aspect-ratio:1;overflow:hidden;background:repeating-conic-gradient(#C9C3E0 0 25%,#EDEAF7 0 50%) 0 0/20px 20px;user-select:none;touch-action:manipulation}
.stage>img{position:absolute;left:50%;top:50%;transform-origin:center;max-width:none;pointer-events:none}
.stage svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hdl{position:absolute;width:34px;height:34px;transform:translate(-50%,-50%);background:#fff;z-index:3;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.hdl.on{background:var(--pink)}
.stage .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:"Mulmaru",sans-serif;padding:20px;color:#2B2340}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;max-width:220px;margin:0 auto}
.pad .pbtn{min-height:50px;font-size:20px;margin:4px}
.field{width:calc(100% - 8px);font:inherit;font-family:"Mulmaru",sans-serif;font-size:18px;padding:12px;border:0;background:var(--panel);color:var(--text)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;font-family:"Mulmaru",sans-serif;font-size:15px;padding:10px 16px;max-width:90vw;display:none;
  box-shadow:0 0 0 3px #fff}
.toast.on{display:block}
textarea.code{width:100%;height:120px;font-size:11px;font-family:monospace;background:var(--panel2);color:var(--text);border:0;padding:8px}
</style>
</head>
<body>
<div class="skydeco" aria-hidden="true"><svg class="pxs" viewBox="0 0 64 120" preserveAspectRatio="xMidYMin slice" id="skysvg"></svg></div>
<div class="app">

<!-- TITLE -->
<section class="screen on" id="s-title">

function sprite(W,H,draw,outline=true){
  const g=Array.from({length:H},()=>Array(W).fill(0));

  draw(R);

  if(outline)for(let j=0;j<H;j++)for(let i=0;i<W;i++)if(!g[j][i]&&((g[j-1]&&g[j-1][i])||(g[j+1]&&g[j+1][i])||g[j][i-1]||g[j][i+1]))o[j][i]=INK;
  let s='';

  return s;
}

  tweed:{top:'#F3E9DC',dress:1,skirt:6,shoe:INK,det:(R,y)=>{[[8,6],[12,8],[15,5],[9,11],[14,12],[7,16],[11,17],[16,18]].forEach(([a,b])=>R(a,y(b),1,1,'#E0628E'));R(9,y(4),6,1,'#FFFFFF')}},
  pink:{top:'#FF5FB0',dress:1,skirt:5,shoe:'#FF3D9A',acc:'bow',det:(R,y)=>{R(4,y(3),4,3,'#fff');R(16,y(3),4,3,'#fff');R(9,y(8),1,1,'#FFE14D');R(14,y(11),1,1,'#FFE14D');R(8,y(16),1,1,'#FFE14D');R(15,y(17),1,1,'#FFE14D')}},

function body(R,L,oy,SK=SKIN){
  const y=v=>v+oy, t2=L.top2||shade(L.top,.82), b2=L.bot?(L.bot2||shade(L.bot,.8)):t2;

const SPR={};
function meSprite(look){const k='me'+look;return SPR[k]||(SPR[k]=sprite(24,27,R=>body(R,LOOK[look]||LOOK.track,1)))}
const SKINS=[['#F6D2B4','#E2B08E'],['#F2C6A0','#D9A57E'],['#D9A577','#BE8758'],['#A8714A','#8C5A37']];
function npcSprite(n){
  const k='n'+JSON.stringify(n);if(SPR[k])return SPR[k];
  const L=Object.assign({},LOOK[n.l]||LOOK.mshirt);if(n.t){L.top=n.t;L.top2=null}
  const sk=n.sk!=null?SKINS[n.sk][0]:SKIN;
  return SPR[k]=sprite(24,36,R=>{
    const h=n.h||'#3B2A20',hs=n.hs;
    body(R,L,9,sk);
    R(7,1,10,9,sk);
    if(!hs){R(7,0,10,3,h);R(6,1,1,6,h);R(17,1,1,6,h);if(n.lg){R(5,2,2,10,h);R(17,2,2,10,h);R(6,1,1,11,h);R(17,1,1,11,h)}}

const crop=(function(){
  const stage=$('stage'),img=$('cimg'),ov=$('ov');
  let src=null,base=1,zoom=1,rot=0,tx=0,ty=0,useDef=false,mode='photo',sel=null;
  let rad={t:.38,b:.38,l:.32,r:.32};
  const W=()=>stage.clientWidth;
  function pts(cx,cy,R,jag){const a=[];const K=jag?54:72;for(let i=0;i<K;i++){const t=i/K*Math.PI*2,c=Math.cos(t),s=Math.sin(t);let x=cx+c*(c>=0?R.r:R.l),y=cy+s*(s>=0?R.b:R.t);if(jag){const j=1+(rnd()-.5)*.05;x=cx+(x-cx)*j;y=cy+(y-cy)*j}a.push([x,y])}return a}
  function draw(){
    const w=W();
    if(src){img.style.transform=`translate(calc(-50% + ${tx*w}px),calc(-50% + ${ty*w}px)) rotate(${rot}deg) scale(${base*zoom*w})`}
    const p=pts(.5*w,.5*w,{t:rad.t*w,b:rad.b*w,l:rad.l*w,r:rad.r*w});
    const d='M'+p.map(q=>q.map(v=>v.toFixed(1)).join(' ')).join('L')+'Z';
    ov.setAttribute('viewBox',`0 0 ${w} ${w}`);
    ov.innerHTML=`<path d="M0 0H${w}V${w}H0Z ${d}" fill="rgba(43,35,64,.55)" fill-rule="evenodd"/><path d="${d}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 5"/>`;
    stage.querySelectorAll('.hdl').forEach(h=>h.remove());
    if(mode==='shape')[['t',.5,.5-rad.t],['b',.5,.5+rad.b],['l',.5-rad.l,.5],['r',.5+rad.r,.5]].forEach(([k,x,y])=>{
      const b=document.createElement('button');b.className='hdl'+(sel===k?' on':'');b.style.left=x*100+'%';b.style.top=y*100+'%';
      b.setAttribute('aria-label',{t:'위쪽 점',b:'아래쪽 점',l:'왼쪽 점',r:'오른쪽 점'}[k]);
      b.onclick=ev=>{ev.stopPropagation();sel=k;$('shapeMsg').textContent=`${{t:'위쪽',b:'아래쪽',l:'왼쪽',r:'오른쪽'}[k]} 점 선택됨`;draw()};stage.appendChild(b)});

function newWish(){

  const pw=()=>{let t=0;for(const k in w)t+=w[k];let x=rnd()*t;for(const k in w){x-=w[k];if(x<=0)return k}return 'rest'};
  const a=pw();w[a]=0;const b=pw();S.wish=[a,b];

/* ---------- payment ---------- */
function liquid(){return S.bank.sav.reduce((a,s)=>a+s.bal,0)+S.bank.dep.reduce((a,d)=>a+d.amt,0)}
function cardRoom(){const c=S.bank.card;return c?c.limit-c.bill:0}
function pay(amt,label,ok,cancel){
  if(amt<=0||S.cash>=amt){S.cash-=Math.max(0,amt);ok();return}
  const short=amt-S.cash;
  const hasSav=liquid()>0,cr=cardRoom();
  openPop('💸 돈이 모자라요',`<p style="margin:0 4px 10px">${esc(label)}에 <b class="d">${amt}만원</b>이 필요한데 <b class="d dn">${short}만원</b>이 모자라요.</p><div class="opts">
    ${hasSav?`<button class="opt px" data-act="brk"><span class="ic">🐷</span><span class="tx"><span class="nm">적금·예금 깨기</span><span class="ef">이자는 포기하고 넣은 돈만 돌려받아요 (${liquid()}만 있음)</span></span></button>`:''}
    ${S.bank.card?`<button class="opt px${cr<amt?' lock':''}" data-act="card" ${cr<amt?'disabled':''}><span class="ic">💳</span><span class="tx"><span class="nm">신용카드로 결제</span><span class="ef">${cr<amt?'한도가 모자라요':`다음 달 월급날 청구돼요 (남은 한도 ${cr}만)`}</span></span></button>`:`<button class="opt px" data-act="mkcard"><span class="ic">💳</span><span class="tx"><span class="nm">신용카드 만들기</span><span class="ef">은행으로 가요</span></span></button>`}
    <button class="opt px" data-act="loan"><span class="ic">🏦</span><span class="tx"><span class="nm">대출 받기</span><span class="ef">매달 나눠서 갚아요. 못 갚으면 파산할 수도…</span></span></button>
    <button class="opt px" data-act="no"><span class="ic">🙅‍♀️</span><span class="tx"><span class="nm">포기하기</span></span></button></div>`,
  {brk:()=>{breakUntil(short);closePop();pay(amt,label,ok,cancel)},
   card:()=>{S.bank.card.bill+=amt;S.cardUsed=(S.cardUsed||0)+amt;closePop();toast(`카드로 ${amt}만원 결제`);ok()},
   mkcard:()=>{closePop();openBank(()=>pay(amt,label,ok,cancel))},
   loan:()=>{closePop();loanPop(()=>pay(amt,label,ok,cancel))},
   no:()=>{closePop();cancel&&cancel()},close:()=>{closePop();cancel&&cancel()}});
}
function breakUntil(need){
  let got=0;
  while(got<need&&(S.bank.sav.length||S.bank.dep.length)){
    if(S.bank.sav.length){const s=S.bank.sav.pop();S.cash+=s.bal;got+=s.bal;toast(`적금 해지: ${s.bal}만원 돌려받음`)}
    else{const d=S.bank.dep.pop();S.cash+=d.amt;got+=d.amt;toast(`예금 해지: ${d.amt}만원 돌려받음`)}
  }
}

    intro:type!=='good'&&rnd()<.6?pick(CLUE[type]):pick(INTRO_GOOD),
    hs:pick(['side','curtain','messy','buzz','long','wavy','twoblock']),hc:pick(HAIRC),sk:Math.floor(rnd()*4),eye:pick(['#5A3B22','#2D7FF9','#1FA85A','#2B2340','#8A5A34']),
    gl:rnd()<.25?pick(['round','square']):null,bd:rnd()<.22?pick(['stubble','mus','beard']):null,cap:rnd()<.08?pick(['#2B2340','#D63E22','#2D7FF9']):null,ear:rnd()<.15,
    out,look:LOOKMAP[out],oc:pick(OUTC),tie:pick(['#C81D3A','#2A5DB0','#1FA85A','#E0A030']),inner:pick(['#FFFFFF','#2B2340','#9ED9FF']),bg:pick(['#9ED9FF','#FFD3E8','#C7F0D0','#FFE9A8','#D9CCF5'])};
}
function pickVenue(type){const ix=type==='good'?0:1;let t=0;for(const k in VENUE)t+=VENUE[k].w[ix];let x=rnd()*t;for(const k in VENUE){x-=VENUE[k].w[ix];if(x<=0)return Object.assign({key:k,card:'v_'+k},VENUE[k])}return Object.assign({key:'chain',card:'v_chain'},VENUE.chain)}
const manN=m=>({l:m.look,t:m.oc,h:m.hc,hs:m.hs,gl:m.gl,bd:m.bd,sk:m.sk,cap:m.cap});
function datePpl(m,seat,a){const y=seat?-2:4;return [Object.assign({x:74,y,w:seat?32:28,n:manN(m),fl:1},{a:a||'bob'}),me(34,seat?-5:4,32,null,{a:a||'bob',dl:-.3})]}
function portraitHTML(m){return `<div class="ptr" style="--bgc:${m.bg}"><svg class="pxs" viewBox="0 0 32 32" aria-hidden="true">${portrait(m)}</svg></div>`}
function runMonth(){
  const p=S.plan,d={},cards=[],lines=[];const before=Object.assign({},S.st),cash0=S.cash;
  const push=(id,fx,pr,extra)=>{if(fx)addFx(d,fx);cards.push({id,fx,pr,extra})};
  let quit=false;
  const W=wishOK(),mult=moodMult()*(1+.15*W.hit.length)*(W.bad.length?.7:1);
  const sc=fx=>{const o={};for(const k in fx)o[k]=fx[k]>0&&k!=='mood'?Math.round(fx[k]*mult):fx[k];return o};
  if(W.hit.length){const fx={mood:10*W.hit.length};addFx(d,fx);lines.push([`💭 소원 들어줌 (${W.hit.map(w=>WISH[w].t).join(', ')})`,fx])}
  if(W.bad.length){const fx={mood:-15*W.bad.length};addFx(d,fx);lines.push(['😒 싫다는 걸 시킴',fx])}
  if(mult!==1)lines.push([`🔥 이번 달 효율 ×${mult.toFixed(2)}`,{}]);
  // hobby
  const h=HOBBY[p.hobby],hf=sc(h.fx);addFx(d,hf);lines.push([`${h.e} ${h.n}`,hf]);
  if(h.cashfx){S.cash+=h.cashfx;lines.push(['📈 재테크 수익',{cash:h.cashfx}])}
  const unseen=h.pool.filter(x=>!S.dex.includes(x));push(pick(unseen.length?unseen:h.pool),null,2);
  // nights
  const n=p.nights,nf=sc(n?{hp:-n*6,nam:n*3,friend:n<=3?2:0,mood:n>=4?-6:0}:{hp:8,int:3,rep:2});
  addFx(d,nf);lines.push([`🌙 평일 밤 ${n}번`,nf]);
  if(n>=2&&rnd()<.55)push(rnd()<.5?'hoesik':'pocha',rnd()<.5?{friend:3,rep:2}:{friend:4},4);
  // sick days
  let sickDays=0;for(let i=3;i<=n;i++)if(rnd()<.3)sickDays++;
  if(S.st.hp+(d.hp||0)<25&&rnd()<.5)sickDays++;
  if(S.st.mood+(d.mood||0)<=10){sickDays++;lines.push(['🫠 번아웃',{}])}
  if(n>=4&&!sickDays)push('sleep',{rep:-8},3);
  if(sickDays){
    const used=[];for(let i=0;i<sickDays;i++){if(S.sick>0){S.sick--;used.push('병가')}else if(S.leave>0){S.leave--;used.push('연차')}else{quit=true}}
    const fx={rep:-3*sickDays,hp:5};push('hang',fx,1,{d:`앓아누워서 ${used.length?used.join(', ')+' 사용':'쉴 날이 없다'}. 목소리는 진짜 아팠다.`});
    lines.push([`🤒 앓아누움 ${sickDays}일`,fx]);
  }
  // weekend
  let blind=false;
  p.week.forEach(k=>{const w=WEEK[k],wf=sc(w.fx);addFx(d,wf);lines.push([`${w.e} ${w.n}`,wf]);if(k==='blind')blind=true;else if(rnd()<.7)push(w.card,null,5)});
  // boyfriend
  if(S.bf){const fx={nam:3,mood:4};addFx(d,fx);S.cash-=5;lines.push([`💑 ${S.bf.m.name}이랑 데이트 (5만)`,fx]);
    if(blind){blind=false;const bf=S.bf;S.bf=null;S.nodate=2;push('busted',{mood:-15,friend:-4},0,{m:bf.m.name});lines.push(['💔 남친한테 소개팅 들킴',{mood:-15}])}}
  // trip
  let tripMeet=0;
  if(p.trip){
    const t=TRIPS[p.trip.dest],L=TRIPLEN[p.trip.len];
    if(L.leave>S.leave){quit=true;S.leave=0}else S.leave-=L.leave;
    const fx=sc({hp:6+L.d*2,nam:t.nam+L.d,charm:2,friend:2,mood:8});addFx(d,fx);lines.push([`✈️ ${t.n} ${L.n}`,fx]);
    if(t.zone!=='국내'&&!S.dex.includes('airport'))push('airport',null,2);
    push('t_'+p.trip.dest,null,1);
    tripMeet=t.zone==='국내'?.15:.3;
  }
  // meetings → interactive
  const meets=[];
  if(blind)meets.push('blind');
  if(!S.bf&&rnd()<h.meet+n*.04+S.st.charm/400+(p.week.includes('hike')?WEEK.hike.meet:0))meets.push('hobby');
  if(!S.bf&&tripMeet&&rnd()<tripMeet)meets.push('trip');
  meets.forEach((src,i)=>{
    const m=genMan();let v;
    if(src==='blind')v=pickVenue(m.type);
    else if(src==='hobby')v={n:h.n,bg:HBG[p.hobby],tb:null,g:.05,mood:0,cap:`${h.n}에서 눈 마주침`,d:'몇 번 마주치다가 먼저 말을 걸어왔다.'};
    else{const t=TRIPS[p.trip.dest];v={n:t.n,bg:t.bg,tb:null,g:.1,mood:3,cap:`${t.n}에서 만난 사람`,d:'같은 게스트하우스에 묵는 사람이었다. 말이 잘 통한다.'}}
    cards.push({id:'date_'+i,date:true,man:m,venue:v,src,pr:-1});
  });
  // passive: clothes + furniture
  const wi=ITEM[S.wear];if(wi&&wi.wear){addFx(d,wi.wear);lines.push([`${wi.e} ${wi.n}`,wi.wear])}
  const ff={};Object.values(S.furn).forEach(id=>{const it=ITEM[id];if(it&&it.wear)addFx(ff,it.wear)});if(Object.keys(ff).length){addFx(d,ff);lines.push(['🛋️ 우리 집 효과',ff])}
  if(S.owned.includes('phone_cheap')){S.cash+=3}
  // specials
  const proj=k=>(S.st[k]||0)+(d[k]||0);const mm=((S.month-1)%12)+1;
  if(mm===4)push(S.bf||S.dates?'cherry2':'cherry1',null,3);
  if(mm===12)push(S.bf?'xmas2':'xmas1',null,3);
  if(S.month===13)push('anniv',{rep:3},3);
  if(proj('nam')>=40&&!S.bf&&rnd()<.35)push('kakao',{nam:3},6);
  if(proj('nam')>=25&&rnd()<.25)push('like',{nam:2},6);
  if(proj('nam')>=60&&!p.week.includes('brunch'))push('nag',{friend:-8},4);
  if(proj('int')>=60&&rnd()<.35)push('praise',{rep:5},5);
  if(proj('hp')<25&&proj('hp')>0&&!sickDays)push('zombie',null,3);
  for(const k in d)S.st[k]=cl(S.st[k]+d[k]);
  const pdl=payday();
  cards.sort((a,b)=>a.pr-b.pr);
  const dates=cards.filter(c=>c.date),rest=cards.filter(c=>!c.date);
  pdl.cards.forEach(c=>rest.push(c));
  let show=dates.concat(rest.slice(0,Math.max(3,5-dates.length)));
  const seenIds=new Set();show=show.filter(c=>!seenIds.has(c.id)&&seenIds.add(c.id));
  show.forEach(c=>{if(!c.date&&!S.dex.includes(c.id))S.dex.push(c.id)});
  M={lines,pd:pdl.lines,before,cash0,quit};
  queue=show;qi=0;afterCards=showSummary;
  save();showCard();
}
function dateView(c){
  const m=c.man,v=c.venue,seat=!!v.tb;
  if(!c.step){c.step='meet';S.dates++;if(v.card&&!S.dex.includes(v.card))S.dex.push(v.card)}
  const head=c.src==='blind'?`소개팅 상대 · ${v.n}`:c.src==='trip'?`${v.n}에서 만난 사람`:`${v.n}에서 만난 사람`;
  let body='',btns='';
  if(c.step==='meet'){
    body=`<div class="cim" style="margin-top:10px">${sceneHTML({bg:v.bg,tb:v.tb,ppl:datePpl(m,seat),cap:v.cap,st:v.st||[]})}</div><div class="cds">${esc(v.d)}</div>`;
    btns=`<button class="pbtn pk big" data-d="talk">이야기 나눠보기</button>`;
  }else{
    if(c.asks===undefined){let pA=.35+S.st.charm/220+(v.g||0)+(m.type!=='good'?.15:0);c.asks=rnd()<cl(pA,.1,.9)}
    body=`<div class="cds" style="font-size:17px">${c.asks?`💌 ${esc(m.name)}에게서 애프터 신청이 왔어요!<br><span class="muted">“다음 주에 한 번 더 볼래요?”</span>`:`📱 ${esc(m.name)}에게서 연락이 없어요…<br><span class="muted">먼저 연락해볼까요?</span>`}</div>`;
    btns=c.asks?`<button class="pbtn pk" data-d="accept">💘 애프터 받기</button><button class="pbtn" data-d="reject">🙅‍♀️ 거절하기</button>`:`<button class="pbtn pk" data-d="contact">📱 먼저 연락하기</button><button class="pbtn" data-d="skip">그냥 넘기기</button>`;
  }
  $('cardBox').innerHTML=`<div class="card pop-in" style="--cc:#FF9EC7"><div class="chd"><span>${esc(head)}</span><span class="st">💘</span></div>
    <div class="prof">${portraitHTML(m)}<div class="pinfo"><div class="d" style="font-size:22px">${esc(m.name)} <span style="font-size:15px">${m.age}살</span></div><div>${esc(m.job)}</div><div class="muted">${m.mbti}</div></div></div>
    <div class="cds">“${esc(m.intro)}”</div>${body}</div>`;
  const cb=$('cardBtns');cb.innerHTML=btns;cb.hidden=false;$('b-next').hidden=true;
  cb.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const a=b.dataset.d;if(a==='talk'){c.step='after';dateView(c)}else dateResolve(c,a)});
}
function dateResolve(c,choice){
  const m=c.man,v=c.venue,seat=!!v.tb;let card,fx,ex={m:m.name},res;
  let yes=choice==='accept';
  if(choice==='contact'){yes=rnd()<(m.type==='good'?.7:.6);if(!yes){card='bad5';fx={nam:5,mood:-8};ex.d=`먼저 연락했는데 ${m.name}에게서 답장이 없다. 읽음 표시만 떴다.`;res='읽씹'}}
  if(yes){
    if(m.type==='good'){
      if(!S.bf){S.bf={m,since:S.month};card='couple1';fx={nam:10,charm:2,mood:12};res='사귐';ex.ppl=datePpl(m,false,'hop')}
      else{card='good1';fx={nam:8,mood:8};res='썸';ex.ppl=datePpl(m,true);ex.bg=v.bg;ex.tb=v.tb||'#7A5236'}
    }else{S.badMen++;S.nodate=2;card=BADCARD[m.type];fx={hp:-10,nam:-4,mood:-15};res='잘못된 남자';if(card!=='bad5'){ex.ppl=datePpl(m,true);ex.bg=v.tb?v.bg:CARDS[card].bg}}
    if(choice==='contact')fx.nam=(fx.nam||0)+5;
  }else if(choice==='reject'){card='reject';res='거절';fx={mood:m.type==='good'?0:8};ex.d=m.type!=='good'?`“좋은 분 만나세요.” 나중에 들어보니 ${BADDESC[m.type]}. 촉 좋다!`:'좋은 사람 같긴 했는데… 마음이 안 갔다.';ex.bg=v.bg;ex.tb=v.tb}
  else if(choice==='skip'){card='noafter';fx={mood:-5};res='흐지부지'}
  for(const k in fx)S.st[k]=cl(S.st[k]+fx[k]);
  M.lines.push([`💘 ${m.name} (${res})`,fx]);
  S.men.push({m,res,mo:S.month});if(S.men.length>40)S.men.shift();
  if(!S.dex.includes(card))S.dex.push(card);
  queue.splice(qi+1,0,{id:card,fx,extra:ex});
  save();qi++;showCard();
}
function payday(){
  const B=S.bank,lines=[],cards=[];
  const sal=SALARY();S.cash+=sal;lines.push(['💼 월급',sal]);
  S.cash-=LIVING;lines.push(['🏠 월세·생활비',-LIVING]);
  const mm=((S.month-1)%12)+1;
  if(mm===12&&S.st.rep>=70){S.cash+=100;lines.push(['🎉 성과급',100]);cards.push({id:'bonus'})}
  // savings
  for(let i=B.sav.length-1;i>=0;i--){const s=B.sav[i];
    if(S.cash>=s.amt){S.cash-=s.amt;s.bal+=s.amt;s.paid++;lines.push([`🐷 적금 ${s.m}개월`,-s.amt]);
      if(s.paid>=s.m){const out=Math.round(s.bal*(1+s.rate));S.cash+=out;B.sav.splice(i,1);B.matured++;lines.push(['🎉 적금 만기!',out]);cards.push({id:'savings',extra:{d:`${s.m}개월 동안 모은 ${s.bal}만원이 이자 붙어서 ${out}만원으로 돌아왔다!`}})}}
    else{S.cash+=s.bal;B.sav.splice(i,1);lines.push(['😢 돈이 모자라 적금 자동 해지',s.bal])}}
  for(let i=B.dep.length-1;i>=0;i--){const dp=B.dep[i];dp.left--;if(dp.left<=0){const out=Math.round(dp.amt*(1+dp.rate));S.cash+=out;B.dep.splice(i,1);B.matured++;lines.push(['🎉 예금 만기!',out])}}
  // card & loan
  let late=false;
  if(B.card&&B.card.bill){const bill=B.card.bill;const paid=Math.min(bill,Math.max(0,S.cash));S.cash-=paid;const rest=bill-paid;B.card.bill=rest?Math.round(rest*1.2):0;lines.push(['💳 카드값',-paid]);
    if(rest){late=true;lines.push(['⚠️ 카드값 연체 (이자 20%)',0])}else if(bill>=150)cards.push({id:'cardbomb'})}
  if(B.loan.bal){const due=Math.min(B.loan.pay,B.loan.bal);if(S.cash>=due){S.cash-=due;B.loan.bal-=due;lines.push(['🏦 대출 상환',-due]);if(!B.loan.bal)B.loan.pay=0}else{late=true;B.loan.bal=Math.round(B.loan.bal*1.05);lines.push(['⚠️ 대출 연체',0])}}
  if(S.loanCard){S.loanCard=false;cards.unshift({id:'loan'})}
  if(late){B.lateMonths++;S.credit=cl(S.credit-60,300,900);cards.push({id:'late',extra:{d:`연체 ${B.lateMonths}개월째. 3개월 넘으면 큰일 난다.`}})}
  else{if(B.lateMonths)B.lateMonths=0;if((B.card&&B.card.limit)||B.loan.pay)S.credit=cl(S.credit+8,300,900)}
  return {lines,cards:cards.map(c=>Object.assign({pr:9},c))};
}
function showCard(){
  const c=queue[qi];
  $('cardStep').textContent=S.month&&M?`${mlabel(S.month)} · ${qi+1}/${queue.length}`:'시작';
  show('s-card');
  if(c.date){dateView(c);return}
  $('cardBtns').hidden=true;$('b-next').hidden=false;
  $('cardBox').innerHTML=cardHTML(c.id,c.fx,c.extra);
  $('b-next').textContent=qi<queue.length-1?'다음':(afterCards===showSummary?'이번 달 정리 보기':'시작하기');
  show('s-card');
}
$('b-next').onclick=()=>{qi++;if(qi<queue.length)showCard();else{const f=afterCards;afterCards=null;f&&f()}};
function showSummary(){
  $('sumTitle').textContent=`${mlabel(S.month)} 정리`;
  let h=`<div class="sec">이번 달 활동</div><div class="px" style="padding:6px 12px">${M.lines.map(([t,fx])=>`<div class="kv"><span>${esc(t)}</span><span class="fx">${fxStr(fx)}</span></div>`).join('')}</div>`;
  h+=`<div class="sec">월급날</div><div class="px" style="padding:6px 12px">${M.pd.map(([t,v])=>`<div class="kv"><span>${esc(t)}</span><b class="${v>0?'up':v<0?'dn':''}">${v?(v>0?'+':'')+v+'만':''}</b></div>`).join('')}<div class="kv"><span>통장</span><b>${S.cash}만원</b></div></div>`;
  h+=`<div class="sec">지금 상태</div><div class="px" style="padding:6px 12px">${STAT.map(([k,ic,l])=>{const v=S.st[k]-M.before[k];return `<div class="kv"><span>${ic} ${l}</span><b>${S.st[k]} ${v?`<span class="${v>0?'up':'dn'}">(${v>0?'+':''}${v})</span>`:''}</b></div>`}).join('')}<div class="kv"><span>🏖️ 연차 / 🤒 병가</span><b>${S.leave} / ${S.sick}</b></div></div>`;
  $('sumBody').innerHTML=h;
  const end=checkEnd();
  $('b-sumnext').textContent=end?'엔딩 보기':`${mlabel(S.month+1)}로`;
  $('b-sumnext').onclick=()=>{if(end){showEnding(end)}else{S.month++;if(S.nodate>0)S.nodate--;newWish();S.plan.week=[];S.plan.trip=null;save();goHome()}};
  show('s-sum');
}
function checkEnd(){
  const s=S.st,B=S.bank;
  if(M&&M.quit)return 'quit';
  if(B.lateMonths>=3||(B.loan.bal+(B.card?B.card.bill:0))>=2500&&S.cash<=0)return 'bankrupt';
  if(s.hp<=0)return 'bihon';
  if(S.month<TOTAL)return null;
  if(S.bf&&S.month-S.bf.since>=6)return 'couple';
  if(S.badMen>=2)return S.cash>=300?'aussie':'bihon2';
  if(S.dates===0&&(s.int>=75||s.rep>=85))return 'boss';
  if(B.matured>=3&&S.cash>=800)return 'rich';
  if(s.friend<=10)return 'cut';
  if(S.dates>=5&&S.badMen===0&&s.charm>=60)return 'pro';
  if(s.nam>=80)return 'legend';
  if(s.friend>=60)return 'friend';
  return 'plain';
}
function showEnding(k){
  S.ended=k;const id='E_'+k;if(!S.dex.includes(id))S.dex.push(id);save();
  $('endCard').innerHTML=cardHTML(id,null,k==='couple'&&S.bf?{m:S.bf.m.name,ppl:datePpl(S.bf.m,false,'hop')}:null);
  $('endStats').innerHTML=STAT.map(([k2,ic,l])=>`<div class="kv"><span>${ic} ${l}</span><b>${S.st[k2]}</b></div>`).join('')+`<div class="kv"><span>📅 버틴 기간</span><b>${mlabel(S.month)}</b></div><div class="kv"><span>💘 데이트</span><b>${S.dates}번</b></div><div class="kv"><span>💰 통장</span><b>${S.cash}만원</b></div><div class="kv"><span>🃏 모은 짤</span><b>${S.dex.length}장</b></div>`;
  show('s-end');
}
$('b-again').onclick=()=>{const dex=S.dex.slice(),n=S.name,f=S.face;S=fresh(n,f);S.dex=dex;newWish();save();queue=[{id:'first'}];qi=0;afterCards=goHome;M=null;showCard()};
$('b-home0').onclick=()=>{refreshTitle();show('s-title')};
})();
</script>
